<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https: http: blob:; img-src 'self' data: blob:;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JellyFish Girl — OpenAB Companion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Live2D Scene Panel -->
    <div id="vrm-panel">
      <canvas id="live2d-canvas"></canvas>
      <div id="model-prompt">
        <p>🎭 Loading JellyFish Girl…</p>
      </div>
    </div>

    <!-- Chat Panel -->
    <div id="chat-panel">
      <div id="chat-header">
        <h1>JellyFish Girl — OpenAB Companion</h1>
        <div id="header-actions">
          <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Open settings">⚙️</button>
        </div>
      </div>

      <div id="messages" role="log" aria-live="polite" aria-label="Chat messages"></div>

      <div id="input-area">
        <textarea id="chat-input" rows="1" placeholder="Type a message…" disabled></textarea>
        <button id="send-btn" disabled>▶</button>
      </div>

      <div id="status-bar">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Loading…</span>
      </div>
    </div>
  </div>

  <!-- Settings Overlay -->
  <div id="settings-overlay">
    <div id="settings-panel">
      <h2>Settings</h2>
      <div class="field">
        <label for="setting-endpoint">OpenAB Endpoint URL</label>
        <input type="text" id="setting-endpoint" placeholder="https://your-gateway/v1/chat/completions">
      </div>
      <div class="field">
        <label for="setting-token">Bearer Token (optional)</label>
        <input type="text" id="setting-token" placeholder="sk-...">
      </div>
      <div class="field">
        <label for="setting-bgcolor">Background Color</label>
        <input type="color" id="setting-bgcolor" value="#1a1a2e">
      </div>
      <div id="settings-actions">
        <button class="btn" id="settings-close">Cancel</button>
        <button class="btn primary" id="settings-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Cubism Core (plain JS, loads .wasm) -->
  <!-- Path: lib/CubismSdkForWeb-5-r.1/Core/live2dcubismcore.min.js -->
  <script src="lib/CubismSdkForWeb-5-r.1/Core/live2dcubismcore.min.js"></script>

  <!-- Fix: Core 5.1.0 doesn't export ColorBlendType_* / AlphaBlendType_* constants
       but Framework 5-r.1 enum init expects them. Define before Framework module loads. -->
  <script>
  (function() {
    // ColorBlendType — used by CubismColorBlend enum
    Live2DCubismCore.ColorBlendType_Normal = 0;
    Live2DCubismCore.ColorBlendType_AddGlow = 1;
    Live2DCubismCore.ColorBlendType_Add = 2;
    Live2DCubismCore.ColorBlendType_Darken = 3;
    Live2DCubismCore.ColorBlendType_Multiply = 4;
    Live2DCubismCore.ColorBlendType_ColorBurn = 5;
    Live2DCubismCore.ColorBlendType_LinearBurn = 6;
    Live2DCubismCore.ColorBlendType_Lighten = 7;
    Live2DCubismCore.ColorBlendType_Screen = 8;
    Live2DCubismCore.ColorBlendType_ColorDodge = 9;
    Live2DCubismCore.ColorBlendType_Overlay = 10;
    Live2DCubismCore.ColorBlendType_SoftLight = 11;
    Live2DCubismCore.ColorBlendType_HardLight = 12;
    Live2DCubismCore.ColorBlendType_LinearLight = 13;
    Live2DCubismCore.ColorBlendType_Hue = 14;
    Live2DCubismCore.ColorBlendType_Color = 15;
    Live2DCubismCore.ColorBlendType_AddCompatible = 16;
    Live2DCubismCore.ColorBlendType_MultiplyCompatible = 17;

    // 🔬 Intercept fetch for shader diagnostics
    const origFetch = window.fetch;
    window.fetch = function(url, ...args) {
      const urlStr = typeof url === 'string' ? url : (url.url || String(url));
      if (urlStr.includes('shader') || urlStr.includes('.vert') || urlStr.includes('.frag')) {
        console.log('[shader-fetch] REQ', urlStr);
        return origFetch.call(this, url, ...args).then(resp => {
          console.log('[shader-fetch] RES', urlStr, resp.status, resp.ok ? 'OK' : 'FAIL');
          return resp;
        });
      }
      return origFetch.call(this, url, ...args);
    };
  })();
  </script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
