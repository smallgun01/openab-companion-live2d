<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https: http: blob: data:; img-src 'self' data: blob:;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JellyFish Girl — OpenAB Companion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Live2D Scene Panel -->
    <div id="vrm-panel">
      <canvas id="live2d-canvas"></canvas>
      <div id="speech-bubble" class="speech-bubble" role="status" aria-live="polite" aria-atomic="true" hidden>
        <span id="speech-bubble-text"></span>
      </div>
      <button id="chat-toggle" class="desktop-control" type="button" title="Open chat" aria-label="Open chat" aria-expanded="false">💬</button>
      <div id="model-prompt">
        <p>🎭 Loading JellyFish Girl…</p>
      </div>
    </div>

    <!-- Chat Panel -->
    <div id="chat-panel">
      <div id="chat-header">
        <h1>JellyFish Girl — OpenAB Companion</h1>
        <div id="header-actions">
          <button class="icon-btn" id="chat-close-btn" title="Close chat" aria-label="Close chat">×</button>
          <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Open settings">⚙️</button>
        </div>
      </div>

      <div id="messages" role="log" aria-live="polite" aria-label="Chat messages"></div>

      <div id="input-area">
        <textarea id="chat-input" rows="1" placeholder="Type a message…" disabled></textarea>
        <button id="send-btn" disabled>▶</button>
      </div>

      <div id="status-bar">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Loading…</span>
      </div>
    </div>
  </div>

  <!-- Settings Overlay -->
  <div id="settings-overlay">
    <div id="settings-panel">
      <h2>Settings</h2>
      <div class="field">
        <label for="setting-endpoint">OpenAB Endpoint URL</label>
        <input type="text" id="setting-endpoint" placeholder="https://your-gateway/v1/chat/completions">
      </div>
      <div class="field">
        <label for="setting-token">Bearer Token (optional)</label>
        <input type="text" id="setting-token" placeholder="sk-...">
      </div>
      <div class="field">
        <label for="setting-bgcolor">Background Color</label>
        <input type="color" id="setting-bgcolor" value="#1a1a2e">
      </div>
      <div id="settings-actions">
        <button class="btn" id="settings-close">Cancel</button>
        <button class="btn primary" id="settings-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Cubism Core (required by untitled-engine for Cubism 5 models) -->
  <script src="lib/CubismSdkForWeb-5-r.1/Core/live2dcubismcore.min.js"></script>

  <!-- PixiJS v8 + Live2D Engine (CDN, zero build) -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/untitled-pixi-live2d-engine@1/dist/cubism.min.js"></script>

  <script type="module" src="js/desktop-shell.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
